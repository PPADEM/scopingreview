title: "PPADEM Presentation Theme"
author: "PPADEM Project"
version: "1.0.0"
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [default, custom.scss]
      slide-number: true
      show-slide-number: all
      transition: fade
      navigation-mode: linear
      controls: true
      logo: logo.png
      footer: "PPADEM Project"
      preview-links: auto
      embed-resources: true
      filters:
        - fix-slide-headers.lua
